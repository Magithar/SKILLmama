name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish, for example 0.1.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - name: Set package version
        run: npm version "${{ inputs.version }}" --workspace packages/core --no-git-tag-version
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit and tag release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core/package.json package-lock.json
          git commit -m "chore: release skillmama@${{ inputs.version }}"
          git tag "skillmama-v${{ inputs.version }}"
          git push origin HEAD --tags
      - name: Publish package
        run: npm publish --workspace packages/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
